# Mosquitto do laboratório NexaHome.
# Roda no 127.0.0.1 do notebook; o ESP32 simulado (Wokwi for VS Code) o alcança
# pelo gateway embutido, resolvendo "host.wokwi.internal" -> o PC.
# Windows: "C:\Program Files\mosquitto\mosquitto.exe" -c lab\mosquitto\mosquitto.conf -v
# Linux:   mosquitto -c lab/mosquitto/mosquitto.conf -v
#
# Antes de subir, crie o arquivo de senhas (gitignored) com as contas do laboratório:
#   mosquitto_passwd -c -b lab/mosquitto/passwd nexasense <senha-da-frota>   # = LAB_MQTT_PASS do firmware
#   mosquitto_passwd    -b lab/mosquitto/passwd analyst   <senha-do-analista>
# Para o reteste hardened, adicione uma conta por dispositivo (usuário = device id do boot):
#   mosquitto_passwd    -b lab/mosquitto/passwd nexa-XXXXXX <senha-unica-do-device>

per_listener_settings false
allow_anonymous false
password_file lab/mosquitto/passwd
acl_file lab/mosquitto/acl

persistence false
log_type all

# --- Listener do PROTÓTIPO (perfil lab): MQTT sem TLS, só no loopback -----------
# É este listener que a avaliação analisa: o CONNECT leva usuário/senha em texto claro.
# Capture no loopback com Wireshark/dumpcap (adaptador de loopback do Npcap).
listener 1883 127.0.0.1

# --- Listener do REteste (perfil hardened): MQTT sobre TLS ----------------------
# Descomente depois de gerar os certificados com lab/mosquitto/gen-certs.sh
# (o CN/SAN do certificado precisa ser "host.wokwi.internal" para o ESP32 validar).
#listener 8883 127.0.0.1
#cafile   lab/mosquitto/certs/ca.crt
#certfile lab/mosquitto/certs/server.crt
#keyfile  lab/mosquitto/certs/server.key
#tls_version tlsv1.2
