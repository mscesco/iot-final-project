; NexaSense - firmware educacional (Hardware Hacking IoT)
; Placa alvo: ESP32 DevKit V1 (ESP32-WROOM-32, 4 MB Flash, ponte USB-UART CP2102/CH340)
;
; Dois perfis de build:
;   lab       -> versão do protótipo, com as condições inseguras que a avaliação deve encontrar
;   hardened  -> versão de reteste, com as mitigações de software aplicadas
;
; Uso:
;   pio run -e lab -t upload        (grava a versão de laboratório)
;   pio device monitor -b 115200    (abre a UART0 / monitor serial)

[platformio]
default_envs = lab

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.0

[env:lab]
build_flags =
    -DNEXA_FW_VERSION=\"0.9.3-lab\"
    -DNEXA_BUILD_LAB=1
    -DCORE_DEBUG_LEVEL=3

[env:hardened]
build_flags =
    -DNEXA_FW_VERSION=\"1.0.0-hardened\"
    -DNEXA_BUILD_HARDENED=1
    -DCORE_DEBUG_LEVEL=0
